# Четыре тотема. Правь тексты здесь — код их не трогает.
#
# Подписи полей, заголовок, цитаты и пословица берутся из самого бланка
# (assets/source/template.png) — это родная графика макета, её не набрать
# заново тем же шрифтом. Здесь только ЗНАЧЕНИЯ, которые меняются.
#
# Язык — английский, как в исходном макете.
# Казахская латиница была написана и лежит в истории проекта; если решишь
# вернуться к ней, учти ошибку, которую я тогда допустил: Ұ и У — РАЗНЫЕ
# буквы, ŪLY DALA (Великая степь), а не ULY DALA (ядовитая степь).
#
# stylize      — добавка к промпту стилизации фото: ТОЛЬКО свет и тон.
#                Упомянешь предмет — модель дорисует его на фон и сломает рамку.
# illustration — промпт центральной иллюстрации.
# track/texture — геометрия следа и фактуры, см. docs/signs-research.md.

at:
  name: {ru: Конь, kk: Ат, en: Horse}
  emoji: "🐎"
  passport:
    origin: GREAT KAZAKH STEPPE
    national_symbol: HORSE
    element: WIND
    territory: SARYARQA
    language_of_land: SILENCE AND HOOFBEATS
    status: FREE NOMAD
    issued_by: THE STEPPE
    validity: AS LONG AS THE WIND BLOWS
    motto: [FREEDOM, IS THE ONLY, BORDER]
    stamp: BORN TO ROAM
    auth_sub: BY HOOFPRINT
    biometric: WIND & HORSEHAIR
  geo:
    coords: "49.5917° N  66.9100° E"
    elevation: "~350m"
    wind: "NE — SW"
    region_label: SARYARQA
    map_spot: [0.50, 0.42]        # доля от габарита карты: Сарыарқа, центр
  track: hoof
  texture: hair
  stylize: >-
    Warm dusty sepia tone, soft diffused daylight, gentle contrast, fine grain.
  illustration: >-
    A wild Kazakh steppe horse galloping at full speed, mane and tail streaming
    in the wind, hooves kicking up dust, sparse steppe grass under it, distant
    low mountains faintly sketched behind.

