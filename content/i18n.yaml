# Тексты интерфейса бота. Русский вычитан, казахский и английский —
# машинный перевод, ПРОВЕРЬ носителем до мероприятия.

ru:
  lang_name: Русский
  start: |
    Сәлем. Это <b>Паспорт Степи</b>.

    Скажешь имя, ответишь на четыре вопроса — и Степь решит, кто ты: конь,
    беркут, тазы или снежный барс. Потом пришлёшь фото и получишь свой паспорт.

    Поехали?
  begin: Начать
  ask_citizenship: |
    Ещё одно поле в паспорте — гражданство.

    Откуда ты?
  citizen_kz: Казахстан
  citizen_other: Другая страна
  ask_name: |
    Как тебя зовут?

    Напиши имя — Степь подберёт тебе тюркское.
  name_too_long: Слишком длинно. Напиши покороче, до 30 символов.
  name_bad: Напиши имя буквами, пожалуйста.
  name_set: |
    <b>{name}</b> — так тебя теперь зовут.{meaning}

    А теперь четыре вопроса.
  ask_photo: |
    <b>{name}</b>, Степь тебя узнала.

    Пришли фото, где хорошо видно лицо. Одно, крупным планом.
  send_as_photo: Пришли обычным фото, а не файлом — иначе я его не вижу.
  meaning_suffix: "\n<i>{meaning}</i>"
  no_face: |
    Не вижу лица на фото.

    Нужен портрет: одно лицо, крупно, без маски и очков-зеркалок. Пришли ещё раз.
  working: Степь смотрит на тебя…
  working_ai: Рисую твой портрет углём. Это займёт полминуты.
  working_render: Печатаю паспорт…
  done: |
    Готово. <b>{totem}</b> — вот кто ты.

    {motto}
  done_fallback: |
    Готово, но портрет вышел простым — рисовалка была занята.

    <b>{totem}</b> — вот кто ты.
  limit_reached: |
    Паспорт у тебя уже есть — он выдаётся один раз.

    Подойди к стойке, если что-то пошло не так.
  error: |
    Что-то сломалось на моей стороне. Попробуй ещё раз — попытка не потрачена.
  restart: Начать заново
  totems:
    at: Конь
    berkut: Беркут
    tazy: Тазы
    irbis: Снежный барс

kk:
  lang_name: Қазақша
  start: |
    Сәлем. Бұл — <b>Дала паспорты</b>.

    Атыңды айтасың, төрт сұраққа жауап бересің — сосын Дала шешеді: сен ат па,
    бүркіт пе, тазы ма, әлде ірбіс пе. Содан кейін суретіңді жібересің де,
    паспортыңды аласың.

    Бастаймыз ба?
  begin: Бастау
  ask_citizenship: |
    Паспорттағы тағы бір жол — азаматтық.

    Қайдансың?
  citizen_kz: Қазақстан
  citizen_other: Басқа ел
  ask_name: |
    Атың кім?

    Атыңды жаз — Дала саған түркі есімін таңдайды.
  name_too_long: Тым ұзын. Қысқарақ жаз, 30 таңбаға дейін.
  name_bad: Атыңды әріппен жаз.
  name_set: |
    <b>{name}</b> — енді сені солай атайды.{meaning}

    Ал енді төрт сұрақ.
  ask_photo: |
    <b>{name}</b>, Дала сені таныды.

    Жүзің анық көрінетін суретіңді жібер. Біреу, жақыннан.
  send_as_photo: Файл емес, кәдімгі сурет ретінде жібер — әйтпесе мен оны көрмеймін.
  meaning_suffix: "\n<i>{meaning}</i>"
  no_face: |
    Суретте жүзді көрмедім.

    Бір адамның жүзі анық көрінуі керек. Қайта жібер.
  working: Дала саған қарап тұр…
  working_ai: Портретіңді көмірмен саламын. Жарты минут кетеді.
  working_render: Паспортты басып жатырмын…
  done: |
    Дайын. <b>{totem}</b> — сен осысың.

    {motto}
  done_fallback: |
    Дайын, бірақ портрет қарапайым болып шықты — сурет салғыш бос емес еді.

    <b>{totem}</b> — сен осысың.
  limit_reached: |
    Паспортың бар ғой — ол бір рет беріледі.

    Бірдеңе дұрыс болмаса, стендке жақында.
  error: |
    Менің жағымда бірдеңе бұзылды. Қайта көр — мүмкіндігің жоғалған жоқ.
  restart: Қайтадан бастау
  totems:
    at: Ат
    berkut: Бүркіт
    tazy: Тазы
    irbis: Ірбіс

en:
  lang_name: English
  start: |
    Salem. This is the <b>Steppe Passport</b>.

    Tell me your name, answer four questions, and the Steppe decides who you
    are: horse, golden eagle, tazy hound or snow leopard. Then you send a photo
    and get your passport.

    Ready?
  begin: Start
  ask_citizenship: |
    One more field in the passport — citizenship.

    Where are you from?
  citizen_kz: Kazakhstan
  citizen_other: Another country
  ask_name: |
    What's your name?

    Type it — the Steppe will find your Turkic one.
  name_too_long: Too long. Keep it under 30 characters.
  name_bad: Please write your name in letters.
  name_set: |
    <b>{name}</b> — that's your name now.{meaning}

    Now, four questions.
  ask_photo: |
    <b>{name}</b>, the Steppe knows you.

    Send a photo where your face is clearly visible. One face, close up.
  send_as_photo: Send it as a regular photo, not a file — otherwise I can't see it.
  meaning_suffix: "\n<i>{meaning}</i>"
  no_face: |
    I can't find a face in that photo.

    I need a portrait: one face, close up, no mask or mirrored sunglasses. Try again.
  working: The Steppe is looking at you…
  working_ai: Drawing your portrait in charcoal. This takes about half a minute.
  working_render: Printing your passport…
  done: |
    Done. <b>{totem}</b> — that's who you are.

    {motto}
  done_fallback: |
    Done, though the portrait came out plain — the illustrator was busy.

    <b>{totem}</b> — that's who you are.
  limit_reached: |
    You already have a passport — it's issued once.

    Come to the stand if something went wrong.
  error: |
    Something broke on my side. Try again — your attempt wasn't spent.
  restart: Start over
  totems:
    at: Horse
    berkut: Golden Eagle
    tazy: Tazy Hound
    irbis: Snow Leopard
